{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <title>
      {% block document_title %}penthouse development template{% endblock document_title %}
      - Penthouse
    </title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="{% static "penthouse/style.css" %}" rel="stylesheet" type="text/css">
    <script src="{% static "penthouse/penthouse.js" %}" defer></script>
  </head>
  <body>
{% block html_body %}
<div id="ph-app-root">
  <nav id="ph-nav">
    <ul>
      <li><a href="{% url "penthouse:account-list" %}">Home</a></li>
      {% if active_account %}
      <li><a href="{% url "penthouse:progression-overview" active_account.id %}">Progression</a></li>
      {% endif %}
    </ul>
  </nav>
  <div id="ph-content">
{% block penthouse_main %}
foobar
{% endblock penthouse_main %}
  </div>
</div>
<template id="tpl-collapsible-container">
  <section class="collapsible-container" id="fixme">
    <header class="collapsible-header">
      <h3>FIXME</h3>
    </header>
    <section class="collapsible-content">
    </section>
  </section>
</template>
{% endblock html_body %}
  </body>
</html>
